[package]
name = "ember"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive"] }
fastcgi-client = { version = "0.12.0", features = ["tokio"] }
flate2 = "1.1.9"
futures-util = "0.3.33"
hmac = "0.12"
libc = "0.2.189"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "blocking"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
